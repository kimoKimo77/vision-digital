name: Deploy static site to AWS S3 and CloudFront

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-static-site-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Test and validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check auth-client.js
          node --check auth-config.js
          node scripts/validate-inline-modules.mjs
      - name: Run auth security regression tests
        run: node --test tests/*.test.mjs
      - name: Check required site and infrastructure files
        run: |
          set -euo pipefail
          test -s index.html
          test -s login.html
          test -s account.html
          test -s supabase/schema.sql
          test -s infra/static-site.yml
          node --check tests/auth-security.test.mjs
          node --check tests/aws-deploy.test.mjs
      - name: Check tracked files for common secret filenames
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|secrets\.json$|.*\.(pem|key|p12)$)'; then
            echo 'Potential secret/configuration file is tracked.' >&2
            exit 1
          fi

  deploy:
    name: Deploy to private S3 origin behind CloudFront
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            value="${!name:-}"
            if [[ -z "$value" || "$value" == *YOUR_* || "$value" == *MY_* ]]; then
              echo "::error::Missing or placeholder GitHub production variable: $name"
              exit 1
            fi
          done
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || { echo "::error::AWS_ROLE_ARN must be an IAM role ARN."; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || { echo "::error::Invalid AWS_REGION format."; exit 1; }
          [[ "$SUPABASE_URL" =~ ^https://[a-zA-Z0-9-]+\.supabase\.co$ ]] || { echo "::error::SUPABASE_URL must be a Supabase project HTTPS URL."; exit 1; }
          [[ "$SUPABASE_PUBLISHABLE_KEY" != *service_role* ]] || { echo "::error::Never use a Supabase service-role key in the browser."; exit 1; }
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: vision-static-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Configure public Supabase browser settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          if (!/^https:\/\/[a-zA-Z0-9-]+\.supabase\.co$/.test(url || '') || !key || /service_role/i.test(key)) {
            throw new Error('Invalid public Supabase browser configuration.');
          }
          await writeFile('auth-config.js',
            '// Generated at deploy time from public GitHub Actions variables. Never put service-role keys here.\n' +
            'export const SUPABASE_URL = ' + JSON.stringify(url) + ';\n' +
            'export const SUPABASE_ANON_KEY = ' + JSON.stringify(key) + ';\n',
            { mode: 0o600 });
          NODE
      - name: Sync site files to private S3 bucket
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync . "s3://$S3_BUCKET/" --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude "tests/*" \
            --exclude "scripts/*" --exclude "infra/*" --exclude "supabase/*" \
            --exclude "README.md" --exclude "SECURITY.md" --exclude "*.yml" --exclude "*.yaml"
      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
